<!doctype html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Append to CSV</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>
    <h1>Append Data to CSV</h1>
    <form id="dataForm">
        <label for="data1">Data 1:</label>
        <input type="text" id="data1" name="data1" required>
        <br>
        <label for="data2">Data 2:</label>
        <input type="text" id="data2" name="data2" required>
        <br>
        <label for="data3">Data 3:</label>
        <input type="text" id="data3" name="data3" required>
        <br>
        <button type="submit">Submit</button>
    </form>
    <div id="response"></div>

    <h2>Data in CSV:</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Data 1</th>
                <th>Data 2</th>
                <th>Data 3</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Link to the external JavaScript file -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
