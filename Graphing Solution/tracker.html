<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Screen Time Tracker</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>
    <h1>Screen Time Tracker</h1>

    <form id="dataForm">
        <label for="dayInput">Day:</label>
        <select id="dayInput" required>
            <option value="">-- Choose a day --</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
        </select>


        <label for="hoursInput">Hours of screen time:</label>
        <input type="number" id="hoursInput" min="0" max="24" step="0.5" required>

        <label>
            <input type="checkbox" id="schoolDay"> School day
        </label>

        <button type="submit">Add data</button>
    </form>

    <div id="graph"></div>

    <!-- Link to our own JavaScript file (must be in the same folder) -->
    <script src="script.js"></script>
</body>

</html>
